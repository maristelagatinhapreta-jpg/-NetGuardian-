<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuardian</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>NetGuardian</h1>

        <div class="cards">
            <div class="card">
                <span>Hostname</span>
                <strong id="hostname">Carregando...</strong>
            </div>
            <div class="card">
                <span>IP Local</span>
                <strong id="ip">Carregando...</strong>
            </div>
            <div class="card">
                <span>Sistema</span>
                <strong id="sistema">Carregando...</strong>
            </div>
            <div class="card">
                <span>Versão</span>
                <strong id="versao">Carregando...</strong>
            </div>
        </div>

        <div class="chart-box">
            <h2>Tráfego de Rede</h2>
            <canvas id="grafico" width="800" height="300"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
