<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>NetGuardian</title>

    <style>
        body {
            background: #071330;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 900px;
            margin: 50px auto;
        }

        .card {
            background: #1b2942;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, .5);
        }

        h1 {
            color: #38bdf8;
        }

        hr {
            border: 1px solid #475569;
        }

        .status {
            color: #22c55e;
            font-weight: bold;
        }

        .box {
            display: inline-block;
            width: 220px;
            margin: 10px;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
        }

        .numero {
            font-size: 22px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🛡️ NetGuardian</h1>

            <h2>Sistema de Monitoramento de Rede</h2>

            <p class="status">Status: Online ✅</p>

            <hr>

            <p><strong>Computador:</strong> {{ hostname }}</p>

            <p><strong>IP:</strong> {{ ip }}</p>

            <p><strong>Sistema:</strong> {{ sistema }}</p>

            <p><strong>Versão:</strong> {{ versao }}</p>

            <hr>

            <h3>📊 Estatísticas de Rede</h3>

            <div class="box">

                <h4>⬆️ Enviados</h4>

                <p class="numero">{{ enviados }} MB</p>

            </div>

            <div class="box">

                <h4>⬇️ Recebidos</h4>

                <p class="numero">{{ recebidos }} MB</p>

            </div>

        </div>

    </div>

</body>

</html>
